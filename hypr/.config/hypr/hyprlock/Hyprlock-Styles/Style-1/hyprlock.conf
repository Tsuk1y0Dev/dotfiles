# Tsukiyo noir — matches SilentSDDM theme.conf.user + Hyprland look

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 0
    brightness = 0.25
    contrast = 1.0
    color = rgba(10, 10, 10, 0.92)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 70
    font_family = $font
    color = rgba(255, 255, 255, 1.0)
    position = 0, 100
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d, %Y"
    font_size = 14
    font_family = $font
    color = rgba(136, 136, 136, 1.0)
    position = 0, 185
    halign = center
    valign = top
}

label {
    monitor =
    text = tsuk1y0
    font_size = 12
    font_family = $font
    color = rgba(136, 136, 136, 1.0)
    position = 0, -55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(38, 38, 38, 1.0)
    check_color = rgba(255, 255, 255, 0.85)
    fail_color = rgba(136, 136, 136, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = true
    rounding = 6
    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL
    dots_spacing = 0.35
    dots_center = true
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[us,ru]
    font_size = 11
    font_family = $font
    color = rgba(136, 136, 136, 1.0)
    onclick = hyprctl switchxkblayout all next
    position = 0, 55
    halign = center
    valign = center
}
